[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "artel-agents"
version = "0.1.0"
description = "Run coding agents in parallel on one git repository."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
artel = "artel.cli:main"

[tool.setuptools]
packages = ["artel"]

[tool.setuptools.package-data]
artel = ["builtin_templates/*.md"]
