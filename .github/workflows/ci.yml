name: ci
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:   # reaches every Python child a test starts, not only the test process
      PYTHONWARNDEFAULTENCODING: "1"
      PYTHONWARNINGS: "error::EncodingWarning"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: git --version
      - name: Unit tests (missing encoding= is an error)
        run: python -X warn_default_encoding -W error::EncodingWarning -m unittest discover -s tests -t . -v
      - name: Build and smoke-test artel.pyz
        run: |
          python tools/build_pyz.py --out dist/artel.pyz
          python dist/artel.pyz --version
      - name: Smoke-test commands outside a repository
        shell: bash
        run: |
          set -u
          pyz="$PWD/dist/artel.pyz"
          empty="$(mktemp -d)"
          cd "$empty"
          for cmd in "python $pyz" "python -m artel"; do
            set +e
            err="$(PYTHONPATH="$GITHUB_WORKSPACE" $cmd status 2>&1 >/dev/null)"
            code=$?
            set -e
            echo "$cmd status -> $code: $err"
            case "$code" in 1|3) ;; *) echo "unexpected exit code $code"; exit 1;; esac
            case "$err" in artel*) ;; *) echo "stderr does not start with 'artel'"; exit 1;; esac
            case "$err" in *Traceback*) echo "traceback"; exit 1;; esac
          done
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/build_pyz.py --out dist/artel.pyz
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
